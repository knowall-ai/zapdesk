name: Poll support mailbox

# Inbound email is fetched by polling the support mailbox via Microsoft Graph.
# This workflow asks the deployed app to drain the mailbox. Each unread message
# is turned into a ticket (or appended as a comment if it's a reply to an
# existing one) and then marked as read.
#
# FALLBACK ONLY: this workflow is disabled in the repository settings. The
# supported poller is a Logic App (see "Scheduling the Poll" in
# docs/EMAIL_SETUP.adoc), and azure/email-poll/ is an optional alternative.
# Run exactly one poller: two at once can file the same email twice.

on:
  schedule:
    # Five minutes is GitHub's minimum schedule interval on every plan.
    # Scheduled workflows also stop after 60 days without repository activity.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Don't queue concurrent runs — if a poll is slow, cancel it so the next tick
# starts fresh and `workflow_dispatch` always runs against the latest state
# rather than queueing behind a hung scheduled run.
concurrency:
  group: email-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Drain support mailbox
        env:
          BASE_URL: ${{ vars.APP_URL }}
          SECRET: ${{ secrets.EMAIL_WEBHOOK_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$SECRET" ]; then
            echo "::error::The APP_URL variable and EMAIL_WEBHOOK_SECRET secret must be configured."
            exit 1
          fi
          response=$(curl -fsSL -X POST "${BASE_URL%/}/api/email/poll" \
            -H "x-webhook-secret: $SECRET" \
            --max-time 90)
          echo "$response"
