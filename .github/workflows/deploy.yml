name: Deploy to Azure App Service

# Deployment-specific values come from repository variables (Settings ->
# Secrets and variables -> Actions -> Variables), not secrets: none is
# sensitive, and variables stay readable once set.
#
#   APP_URL            canonical site URL, e.g. https://zapdesk.knowall.ai
#   MAIL_FROM_NAME     display name on outbound mail, e.g. "KnowAll AI Support"
#   AZURE_WEBAPP_NAME  App Service to deploy to, e.g. zapdesk-knowallai
#   AZURE_DEVOPS_ORG   Azure DevOps organisation, e.g. KnowAll
#
# The production environment's variables sign the deploy in to Azure with
# GitHub's OIDC token: AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_SUBSCRIPTION_ID, for an app registration with a federated credential
# for this repo's production environment and Website Contributor on the App
# Service only.
#
# None has a default. The deploy checks all four are set and stops if any
# is missing, because a default that silently disagrees with reality is a
# misconfiguration nobody can see -- and it would leave production values
# hardcoded in this file, which is what the variables exist to remove. No
# deployment-specific value is written into this workflow any more.

on:
  # Deploy when a release tag is created (e.g., v1.0.0)
  push:
    tags:
      - 'v*'
  # Allow manual deployment
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  BUN_VERSION: '1.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check required configuration
        # No fallback defaults: a default that silently disagrees with reality is
        # a misconfiguration you cannot see. Fail here, naming what is missing,
        # rather than deploying an empty APP_URL and breaking every link in
        # outbound mail. Values go through env rather than being interpolated
        # into the script, so a variable's contents can never become shell.
        env:
          APP_URL: ${{ vars.APP_URL }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_DEVOPS_ORG: ${{ vars.AZURE_DEVOPS_ORG }}
        run: |
          missing=""
          [ -n "$APP_URL" ] || missing="$missing APP_URL"
          [ -n "$MAIL_FROM_NAME" ] || missing="$missing MAIL_FROM_NAME"
          [ -n "$AZURE_WEBAPP_NAME" ] || missing="$missing AZURE_WEBAPP_NAME"
          [ -n "$AZURE_DEVOPS_ORG" ] || missing="$missing AZURE_DEVOPS_ORG"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Set them at Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          # Build-time environment variables (non-sensitive)
          NEXT_TELEMETRY_DISABLED: 1
          # Runtime config (public)
          NEXTAUTH_URL: ${{ vars.APP_URL }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Prepare standalone deployment
        run: |
          # Copy static assets to standalone folder
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "Standalone deployment package prepared"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextjs-app
          include-hidden-files: true
          path: .next/standalone
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    # Signs in with GitHub's OIDC token for the production environment: no stored Azure secret.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nextjs-app

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
          startup-command: 'node server.js'

      - name: Configure App Settings
        uses: azure/appservice-settings@1808c4fbba4b8723107948a295d396a5c0e33dcd # v1.1.1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          mask-inputs: true
          app-settings-json: |
            [
              {"name": "NEXTAUTH_URL", "value": "${{ vars.APP_URL }}"},
              {"name": "NEXTAUTH_SECRET", "value": "${{ secrets.NEXTAUTH_SECRET }}"},
              {"name": "AZURE_AD_CLIENT_ID", "value": "${{ secrets.AZURE_AD_CLIENT_ID }}"},
              {"name": "AZURE_AD_CLIENT_SECRET", "value": "${{ secrets.AZURE_AD_CLIENT_SECRET }}"},
              {"name": "AZURE_AD_TENANT_ID", "value": "${{ secrets.AZURE_AD_TENANT_ID }}"},
              {"name": "AZURE_DEVOPS_ORG", "value": "${{ vars.AZURE_DEVOPS_ORG }}"},
              {"name": "AZURE_DEVOPS_PAT", "value": "${{ secrets.AZURE_DEVOPS_PAT }}"},
              {"name": "EMAIL_WEBHOOK_SECRET", "value": "${{ secrets.EMAIL_WEBHOOK_SECRET }}"},
              {"name": "APP_URL", "value": "${{ vars.APP_URL }}"},
              {"name": "MAIL_FROM", "value": "${{ secrets.MAIL_POLL_MAILBOX }}"},
              {"name": "MAIL_FROM_NAME", "value": "${{ vars.MAIL_FROM_NAME }}"},
              {"name": "MAIL_POLL_MAILBOX", "value": "${{ secrets.MAIL_POLL_MAILBOX }}"},
              {"name": "MAIL_TENANT_ID", "value": "${{ secrets.MAIL_TENANT_ID }}"},
              {"name": "MAIL_CLIENT_ID", "value": "${{ secrets.MAIL_CLIENT_ID }}"},
              {"name": "MAIL_CLIENT_SECRET", "value": "${{ secrets.MAIL_CLIENT_SECRET }}"},
              {"name": "SUPPORT_TEAM_NOTIFY_EMAIL", "value": "${{ secrets.SUPPORT_TEAM_NOTIFY_EMAIL }}"}
            ]

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify on success
        if: ${{ needs.deploy.result == 'success' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: echo "Deployment to $APP_URL completed successfully!"

      - name: Notify on failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "Deployment failed!"
          exit 1
