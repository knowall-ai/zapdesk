name: Deploy to Azure App Service

# Deployment-specific values come from repository variables (Settings ->
# Secrets and variables -> Actions -> Variables), not secrets: neither is
# sensitive, and variables stay readable once set.
#
#   APP_URL         canonical site URL, e.g. https://zapdesk.knowall.ai
#   MAIL_FROM_NAME  display name on outbound mail, e.g. "KnowAll AI Support"
#
# Neither has a default. The deploy checks both are set and stops if either
# is missing, because a default that silently disagrees with reality is a
# misconfiguration nobody can see -- and it would leave the production URL
# hardcoded in this file, which is what the variables exist to remove.

on:
  # Deploy when a release tag is created (e.g., v1.0.0)
  push:
    tags:
      - 'v*'
  # Allow manual deployment
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: zapdesk-knowallai
  BUN_VERSION: '1.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check required configuration
        # No fallback defaults: a default that silently disagrees with reality is
        # a misconfiguration you cannot see. Fail here, naming what is missing,
        # rather than deploying an empty APP_URL and breaking every link in
        # outbound mail. Values go through env rather than being interpolated
        # into the script, so a variable's contents can never become shell.
        env:
          APP_URL: ${{ vars.APP_URL }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
        run: |
          missing=""
          [ -n "$APP_URL" ] || missing="$missing APP_URL"
          [ -n "$MAIL_FROM_NAME" ] || missing="$missing MAIL_FROM_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Set them at Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          # Build-time environment variables (non-sensitive)
          NEXT_TELEMETRY_DISABLED: 1
          # Runtime config (public)
          NEXTAUTH_URL: ${{ vars.APP_URL }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Prepare standalone deployment
        run: |
          # Copy static assets to standalone folder
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "Standalone deployment package prepared"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          include-hidden-files: true
          path: .next/standalone
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
          startup-command: 'node server.js'

      - name: Configure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          mask-inputs: true
          app-settings-json: |
            [
              {"name": "NEXTAUTH_URL", "value": "${{ vars.APP_URL }}"},
              {"name": "NEXTAUTH_SECRET", "value": "${{ secrets.NEXTAUTH_SECRET }}"},
              {"name": "AZURE_AD_CLIENT_ID", "value": "${{ secrets.AZURE_AD_CLIENT_ID }}"},
              {"name": "AZURE_AD_CLIENT_SECRET", "value": "${{ secrets.AZURE_AD_CLIENT_SECRET }}"},
              {"name": "AZURE_AD_TENANT_ID", "value": "${{ secrets.AZURE_AD_TENANT_ID }}"},
              {"name": "AZURE_DEVOPS_ORG", "value": "KnowAll"},
              {"name": "AZURE_DEVOPS_PAT", "value": "${{ secrets.AZURE_DEVOPS_PAT }}"},
              {"name": "EMAIL_WEBHOOK_SECRET", "value": "${{ secrets.EMAIL_WEBHOOK_SECRET }}"},
              {"name": "APP_URL", "value": "${{ vars.APP_URL }}"},
              {"name": "MAIL_FROM", "value": "${{ secrets.MAIL_POLL_MAILBOX }}"},
              {"name": "MAIL_FROM_NAME", "value": "${{ vars.MAIL_FROM_NAME }}"},
              {"name": "MAIL_POLL_MAILBOX", "value": "${{ secrets.MAIL_POLL_MAILBOX }}"},
              {"name": "MAIL_TENANT_ID", "value": "${{ secrets.MAIL_TENANT_ID }}"},
              {"name": "MAIL_CLIENT_ID", "value": "${{ secrets.MAIL_CLIENT_ID }}"},
              {"name": "MAIL_CLIENT_SECRET", "value": "${{ secrets.MAIL_CLIENT_SECRET }}"},
              {"name": "SUPPORT_TEAM_NOTIFY_EMAIL", "value": "${{ secrets.SUPPORT_TEAM_NOTIFY_EMAIL }}"}
            ]

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify on success
        if: ${{ needs.deploy.result == 'success' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: echo "Deployment to $APP_URL completed successfully!"

      - name: Notify on failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "Deployment failed!"
          exit 1
