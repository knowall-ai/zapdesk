<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180">
  <defs>
    <!-- Subtle shine for 3D effect -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect x="0" y="0" width="64" height="64" rx="8" ry="8" fill="#9dff0a" />

  <!-- Subtle shine overlay -->
  <rect x="0" y="0" width="64" height="64" rx="8" ry="8" fill="url(#shineGradient)" />

  <!-- Lightning bolt -->
  <polygon points="37,5 17,35.5 29.5,35.5 24.5,59 47,28 34.5,28" fill="#030712" />
</svg>